services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether-dev
      POSTGRES_DB: aether_pdm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether_pdm"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aether
      MINIO_ROOT_PASSWORD: aether-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://aether:aether-dev@postgres:5432/aether_pdm
      --default-artifact-root s3://mlflow-artifacts/
      --artifacts-destination s3://mlflow-artifacts/
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: aether
      AWS_SECRET_ACCESS_KEY: aether-dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: api
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
    environment:
      AETHER_DB_URL: postgresql://aether:aether-dev@postgres:5432/aether_pdm
      AETHER_MLFLOW_TRACKING_URI: http://mlflow:5000
      AETHER_S3_ENDPOINT_URL: http://minio:9000
      AETHER_AWS_ACCESS_KEY_ID: aether
      AETHER_AWS_SECRET_ACCESS_KEY: aether-dev
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: web
    ports:
      - "8501:8501"
    environment:
      AETHER_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started

  train:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.train
    environment:
      AETHER_MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_started
    command: >
      --features /app/data/interim/features/features_v1.parquet
      --anomaly-config configs/train_anomaly.yaml
      --fault-config configs/train_fault.yaml
      --calibrate
    profiles:
      - train

  batch:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.train
    # Dockerfile.train's ENTRYPOINT runs aether_pdm.models.train; the
    # scheduler needs a different module, so override it here.
    entrypoint: ["python", "-m", "aether_pdm.ops.scheduler"]
    environment:
      AETHER_MLFLOW_TRACKING_URI: http://mlflow:5000
      AETHER_DB_URL: postgresql://aether:aether-dev@postgres:5432/aether_pdm
      AETHER_BATCH_ORG: ${AETHER_BATCH_ORG:-default}
    volumes:
      - data:/app/data
    depends_on:
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy
    command: >
      --features /app/data/interim/features/features_v1.parquet
      --org ${AETHER_BATCH_ORG:-default}
    profiles:
      - batch

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ../grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  data:
  grafana-data:
