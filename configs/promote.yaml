# Canonical promotion gates for AetherPdM models.
#
# These gates are evaluated by the GatedOps gate engine
# (gatedops.gate.engine.evaluate_gate) and match the defaults of
# promote_anomaly / promote_fault. Load them with
# aether_pdm.ops.promote.load_promote_gates.
anomaly:
  model_name: aether-anomaly
  thresholds:
    - metric: detection_rate
      op: ">="
      value: 0.80
    - metric: false_alarm_rate
      op: "<="
      value: 0.10

fault:
  model_name: aether-fault-clf
  # Data-grounded fault gate (2026-08). Measured val f1_macro ceiling on real
  # CWRU held-out files is ~0.76; random guessing for 4 classes is 0.25.
  # 0.70 sits below the measured ceiling but well above chance, so promotion
  # requires meaningfully-better-than-random performance with margin.
  # Synthetic val reaches 1.0 and is NOT representative of real CWRU
  # difficulty (ball<->outer@0.007, normal->ball 32% confusions on real data).
  thresholds:
    - metric: f1_macro
      op: ">="
      value: 0.70
    - metric: balanced_accuracy
      op: ">="
      value: 0.70
