name: Demo GIFs

on:
  workflow_dispatch:          # manual trigger
  push:
    paths:
      - 'docs/demo/*.tape'    # re-render when tapes change

# Explicit workflow-level permission so the commit-back step's `git push`
# deterministically gets contents:write regardless of repo-default settings.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        # The tapes run real `uv run python ...` commands. Sync the repo so
        # they at least attempt on CI. Note: the runner has no trained models,
        # feature parquet, or running API — CI GIFs show the real commands
        # being typed; local renders (with real data) are the full demo.
        run: uv sync --extra dev --extra web

      - name: Install VHS
        # VHS needs TWO external binaries to render GIFs: `ttyd` (the PTY
        # backend) and `ffmpeg` (GIF encoding). Neither is bundled by
        # `go install`, and neither is preinstalled on ubuntu-latest — the
        # runner reports "ffmpeg is not installed" if it is missing.
        # (charmbracelet/vhs-action@v3 does not exist yet — latest tag is
        # v2.1.0 — so install both manually and keep go install.)
        run: |
          sudo apt-get update
          sudo apt-get install -y ttyd ffmpeg
          go install github.com/charmbracelet/vhs@latest

      - name: Render tapes
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          vhs docs/demo/ops-loop.tape
          vhs docs/demo/api.tape

      - name: Upload GIFs
        # Belt-and-suspenders backup: artifacts expire after ~90 days, so
        # the commit-back step below is the primary persistence mechanism.
        uses: actions/upload-artifact@v4
        with:
          name: demo-gifs
          path: docs/demo/*.gif

      - name: Commit rendered GIFs
        # Persist the GIFs in the repo so they can be embedded in the README
        # via stable relative links (docs/demo/*.gif) instead of expiring
        # Actions artifacts. actions/checkout@v4 persists the GITHUB_TOKEN
        # by default, giving us content:write on the current branch (main for
        # workflow_dispatch, the pushed branch for path-filtered pushes).
        #
        # Re-trigger prevention note: GitHub Actions does NOT honor `[skip ci]`
        # (that's GitLab/CircleCI). The `[skip ci]` token in the message is kept
        # because it is harmless, but the sole re-trigger prevention is the path
        # filter (`push.paths: docs/demo/*.tape`): a push that only touches the
        # GIF files does not match the filter, so this workflow is not re-run.
        #
        # `git add docs/demo/*.gif` with NO matching GIFs exits 128 (unmatched
        # pathspec) — under `bash -e` that would fail the step. Guard with an
        # existence check so a render-skip never kills the job.
        run: |
          if ls docs/demo/*.gif >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/demo/*.gif
            if git diff --cached --quiet; then
              echo "No GIF changes to commit."
            else
              git commit -m "docs(demo): refresh VHS demo GIFs [skip ci]"
              git push
            fi
          else
            echo "No GIFs produced; skipping commit."
          fi
