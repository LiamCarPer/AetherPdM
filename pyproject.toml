[project]
name = "aether-pdm"
version = "0.1.0"
description = "B2B condition monitoring + predictive maintenance for rotating equipment (bearings/motors)"
requires-python = ">=3.12"
authors = [
    {name = "LiamCarPer", email = "liamcarper@users.noreply.github.com"},
]
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mlflow>=2.17",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "h5py>=3.12",
    "httpx>=0.28",
    "python-multipart>=0.0.14",
    "pytest-asyncio[dev]>=1.4.0",
    "prometheus-client>=0.21",
    "gatedops @ git+https://github.com/LiamCarPer/GatedOps.git@v0.2.0",
    # PyTorch: core CV claim, but imported lazily (see aether_pdm.models.torch_anomaly)
    # so the package itself and CI fast tests never pay the import cost.
    "torch>=2.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "skl2onnx>=1.20.0",
    "paho-mqtt>=2.1.0",
]

# CPU-only torch wheels: explicit index confined to torch so every other
# dependency still resolves from PyPI (first-match would otherwise pull stale
# transitive deps from the pytorch index).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "mypy>=1.13",
    "ipython>=8.30",
]
prefect = [
    "prefect>=3.0",
]
web = [
    "streamlit>=1.40",
    "plotly>=5.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "download: marks tests that download external data",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
