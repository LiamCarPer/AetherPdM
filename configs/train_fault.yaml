# Fault classification training config
model:
  name: "aether-fault-clf"
  algorithm: "RandomForest"
  params:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 4
    class_weight: "balanced"
    random_state: 42

features:
  - rms
  - peak
  - crest
  - kurtosis
  - skew
  - bpfo_amp
  - bpfi_amp
  - bsf_amp
  - ftf_amp
  - envelope_energy
  - envelope_peak
  - fft_peak_0_500
  - fft_peak_500_1000
  - fft_peak_1000_2000
  - fft_peak_2000_4000
  - fft_peak_4000_6000.0
  # Scale-invariant fault-frequency ratios (feature version v2): which fault
  # frequency DOMINATES the envelope spectrum, normalized by total envelope
  # energy. Invariant to absolute vibration level (load/severity).
  - bpfo_ratio
  - bpfi_ratio
  - bsf_ratio
  - ftf_ratio
  - bpfi_over_bpfo
  - bsf_over_bpfo
  - bpfi_over_bsf

data:
  source: "cwru"
  classes: ["normal", "inner_race", "outer_race", "ball"]
  window_samples: 2048
  overlap: 0.5
  split: "train"

eval:
  split_method: "by_file"
  metrics:
    - f1_macro
    - balanced_accuracy
    - confusion_matrix
    - false_positive_rate_per_class
