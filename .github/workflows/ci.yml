name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra web

      - name: Lint with Ruff
        run: uv run ruff check src/ web/

      - name: Type check with mypy
        run: uv run mypy src/ web/ --config-file pyproject.toml

      - name: Run fast tests
        run: uv run pytest tests/ -v -m "not slow" --cov=src/aether_pdm --cov-report=term-missing

      - name: Run smoke test
        run: uv run pytest tests/test_training_smoke.py tests/test_inference_smoke.py tests/test_export_edge.py tests/test_gpu_train.py -v --cov=src/aether_pdm --cov-append --cov-report=term

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

      - name: Build API image
        run: docker compose -f infra/docker/docker-compose.yml build api

      - name: Boot core stack (postgres + minio + mlflow + api)
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d postgres minio mlflow api
          # wait for API /health (entrypoint waits for MLflow, then starts uvicorn)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "API healthy after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time"
          docker compose -f infra/docker/docker-compose.yml logs --no-color mlflow
          echo "--- api logs ---"
          docker compose -f infra/docker/docker-compose.yml logs --no-color api
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
