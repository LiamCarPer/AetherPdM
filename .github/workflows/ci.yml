name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra web

      - name: Lint with Ruff
        run: uv run ruff check src/ web/

      - name: Type check with mypy
        run: uv run mypy src/ web/ --config-file pyproject.toml

      - name: Run fast tests
        run: uv run pytest tests/ -v -m "not slow" --cov=src/aether_pdm --cov-report=term-missing

      - name: Run smoke test
        run: uv run pytest tests/test_training_smoke.py -v --cov=src/aether_pdm --cov-append --cov-report=term
