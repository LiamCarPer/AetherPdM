# AetherPdM asset registry config
# Copy to assets.yaml and fill with your asset topology.

# --- Hierarchical config (org -> plant -> asset) ---
# This mirrors the multi-tenant hierarchy persisted to the DB.

org: "acme-corp"
plants:
  - name: "plant-frankfurt"
    assets:
      - id: "motor-001"
        type: "motor"
        bearings:
          - position: "drive_end"
            model: "SKF-6205"
          - position: "fan_end"
            model: "SKF-6203"
        rpm_nominal: 1772
        load_nominal: 1.0
        sampling_rate: 12000
        anomaly_threshold: 0.85
      - id: "motor-002"
        type: "motor"
        bearings:
          - position: "drive_end"
            model: "SKF-6205"
        rpm_nominal: 1730
        load_nominal: 3.0
        sampling_rate: 12000
        anomaly_threshold: 0.90
  - name: "plant-chicago"
    assets:
      - id: "pump-101"
        type: "pump"
        bearings:
          - position: "drive_end"
            model: "SKF-6205"
        rpm_nominal: 1797
        load_nominal: 0.0
        sampling_rate: 12000
        anomaly_threshold: 0.80

# --- Flat DB-style config (as persisted in the `assets` table) ---
# Each asset row carries `org` (tenant) and `plant` (plant within the org).
assets:
  - asset_id: "motor-001"
    org: "acme"          # tenant (organization) owning this asset
    plant: "plant-1"     # plant within the org
    asset_type: "motor"
    rpm_nominal: 1772
